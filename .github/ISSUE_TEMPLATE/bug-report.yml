name: "🪲 Bug Report"
description: "回報 markitdown 維護型 fork 或檔案轉換的問題"
labels: ["bug"]
body:
  - type: "markdown"
    attributes:
      value: |
        > [!IMPORTANT]
        > 提交問題前，請先確認：
        > 1. 問題在最新 `main` 仍可重現。
        > 2. 請勿在此附上包含機密資料、個人個資或受保護版權的真實文件。若涉及安全性，請走 [Security Advisory](https://github.com/SanHsien/markitdown/security/advisories/new)。

  - type: "dropdown"
    id: "converter"
    attributes:
      label: "發生問題的轉換格式／模組"
      description: "請選擇是在處理哪種格式或模組時發生問題"
      options:
        - "PDF"
        - "Word (.docx)"
        - "PowerPoint (.pptx)"
        - "Excel (.xlsx, .xls)"
        - "HTML / 網頁"
        - "音訊 / 語音轉文字"
        - "圖片 / OCR (markitdown-ocr)"
        - "MCP 伺服器 (markitdown-mcp)"
        - "純文字 / CSV / JSON / XML"
        - "CLI 命令列工具"
        - "Windows 本機維護環境 (tools/dev_check.ps1)"
        - "其他"
    validations:
      required: true

  - type: "dropdown"
    id: "os"
    attributes:
      label: "作業系統環境"
      options:
        - "Windows 11 原生 (PowerShell)"
        - "Windows 10"
        - "Ubuntu / Linux"
        - "macOS"
    validations:
      required: true

  - type: "input"
    id: "python-version"
    attributes:
      label: "Python 版本"
      placeholder: "例如：Python 3.14.7 或 3.12"
    validations:
      required: true

  - type: "textarea"
    id: "description"
    attributes:
      label: "問題描述"
      description: "簡要清楚地說明問題"
    validations:
      required: true

  - type: "textarea"
    id: "reproduction"
    attributes:
      label: "重現步驟或最小程式碼"
      description: "請提供最小可重現範例程式碼或步驟（勿放敏感文件）"
      placeholder: |
        from markitdown import MarkItDown
        md = MarkItDown()
        md.convert(...)
    validations:
      required: true

  - type: "textarea"
    id: "expected"
    attributes:
      label: "預期行為與實際行為"
      description: "預期應該產出什麼樣的 Markdown？實際發生了什麼（附上錯誤輸出）？"
    validations:
      required: true
